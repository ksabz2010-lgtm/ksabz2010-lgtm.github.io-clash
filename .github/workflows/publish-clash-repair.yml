name: Publish CLASH startup repair
on:
  push:
    paths:
      - ".github/workflows/publish-clash-repair.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Remove temporary workflow from published files and repository
        run: |
          rm -f .github/workflows/publish-clash-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "Remove temporary CLASH publishing workflow" || true
          git push origin main || true
      - name: Upload repaired site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy repaired site
        id: deployment
        uses: actions/deploy-pages@v4
